name: ${APP_NAME:-jungo}

services:
  # Applies the migrations built into the image (console db:migrate), then exits; app waits for it.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: prod
    entrypoint: ["./console", "db:migrate"]
    env_file:
      - ../.env
    environment:
      API_ENVIRONMENT: production
    depends_on:
      postgresql:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: prod
    ports:
      - "${API_SERVER_PORT:-8080}:${API_SERVER_PORT:-8080}"
    env_file:
      - ../.env
    # Forced here, whatever .env says: the prod stack never runs with development defaults
    # (emails written to the log, reCAPTCHA mock, Gin debug output).
    environment:
      API_ENVIRONMENT: production
      GIN_MODE: release
      GOMEMLIMIT: ${APP_GOMEMLIMIT:-1800MiB}
    volumes:
      - storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Longer than Fx's 15s stop timeout, so in-flight requests finish before SIGKILL.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-2048M}
          cpus: "${APP_CPU_LIMIT:-2.0}"

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jungo}
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-jungo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    profiles: ["cache", "full"]
    # Evicts keys with a TTL (every key the app writes has one) before the container's memory limit.
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  postgres_data:
  storage:
